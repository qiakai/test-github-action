name: test-commit

# Test qiakai/x-cmd-action-ai/commit: Conventional Commits check
# (mode=check) or full message generation (mode=generate) via `x ai commit`.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check | generate'
        default: 'check'
      fail_on_invalid:
        description: 'check mode: fail the workflow on invalid commits'
        default: 'false'
      review_invalid:
        description: 'check mode: post AI review of invalid commits (needs pr_num for comment; falls back to job summary)'
        default: 'false'
      pr_num:
        description: 'check mode: PR number to post the review comment to'
        default: ''
      ref:
        description: 'branch/ref to check out (default: repository default branch)'
        default: ''

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref }}

      # generate mode needs changes — make some. The new file is left
      # UNSTAGED on purpose: the action's stage_all should pick it up.
      - name: make a change (generate mode)
        if: github.event.inputs.mode == 'generate'
        run: |
          echo "test: $(date)" >> .ai-commit-test
          echo "new file: $(date)" > .ai-commit-test-new

      - uses: qiakai/x-cmd-action-ai/commit@main
        id: ai-commit
        with:
          mode: ${{ github.event.inputs.mode }}
          fail_on_invalid: ${{ github.event.inputs.fail_on_invalid }}
          review_invalid: ${{ github.event.inputs.review_invalid }}
          pr_num: ${{ github.event.inputs.pr_num }}
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

      - name: show generated message
        if: github.event.inputs.mode == 'generate'
        run: |
          echo "--- commit_message output ---"
          printf '%s\n' "${{ steps.ai-commit.outputs.commit_message }}"
          echo "--- end ---"

      - name: commit & push (generate mode)
        if: github.event.inputs.mode == 'generate' && steps.ai-commit.outputs.commit_message != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "${{ steps.ai-commit.outputs.commit_message }}"
          # checkout leaves a detached HEAD — push it onto main explicitly
          git push origin HEAD:main
