name: reply

# Test x-cmd-action-ai/reply: react + reply when @x is mentioned.
# Requires MINIMAX_TOKEN repo secret for the AI reply (use_ai: true).

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  workflow_dispatch:

concurrency:
  group: aireply-bot
  cancel-in-progress: false

jobs:
  reply:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: qiakai/x-cmd-action-ai/reply@main
        with:
          keyword: '@x'
          reaction: eyes
          comment: '👀 on it'
          use_ai: 'true'
        env:
          MINIMAX_TOKEN: ${{ secrets.MINIMAX_TOKEN }}
