name: reply

# Test x-cmd-action-ai/reply: react + reply when @x is mentioned.
# Requires MINIMAX_API_KEY repo secret for the AI reply (use_ai: true).

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  workflow_dispatch:

concurrency:
  group: aireply-bot
  cancel-in-progress: false

jobs:
  reply:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: force https for github git urls
        run: git config --global url."https://github.com/".insteadOf git@github.com:

      - uses: qiakai/x-cmd-action-ai/reply@main
        with:
          keyword: '@x'
          reaction: eyes
          comment: '👀 on it'
          use_ai: 'true'
        env:
          # x-cmd's minimax module reads MINIMAX_API_KEY as the env fallback.
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
