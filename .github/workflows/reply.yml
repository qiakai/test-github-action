name: reply

# Test x-cmd-action-ai/reply: react + reply when @x is mentioned.
# Requires MINIMAX_API_KEY repo secret for the AI reply (use_ai: true).

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  workflow_dispatch:

concurrency:
  group: aireply-bot
  cancel-in-progress: false

jobs:
  reply:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: force https (+ auth) for github git urls
        # x-cmd/x7 is private: inject a PAT with read access when available.
        env:
          GH_PAT_X7: ${{ secrets.GH_PAT_X7 }}
        run: |
          if [ -n "$GH_PAT_X7" ]; then
            git config --global "url.https://x-access-token:${GH_PAT_X7}@github.com/.insteadOf" "git@github.com:"
          else
            git config --global url."https://github.com/".insteadOf git@github.com:
          fi

      - uses: qiakai/x-cmd-action-ai/reply@main
        with:
          keyword: '@x'
          reaction: eyes
          comment: '👀 on it'
          use_ai: 'true'
        env:
          # x-cmd's minimax module reads MINIMAX_API_KEY as the env fallback.
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
