name: test-review

# Test qiakai/x-cmd-action-ai/review: review a PR diff, post a review
# comment. Trigger: open/update a PR in this repo.

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:

      - uses: qiakai/x-cmd-action-ai/review@main
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
