name: test-spec

# Test qiakai/x-cmd-action-ai/spec: turn an issue (+ comments) into an
# RFC or post-mortem via `x ai spec --mode ... -`.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to use as source material'
        required: true
      mode:
        description: 'rfc | postmortem'
        default: 'rfc'

jobs:
  spec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:

      - uses: qiakai/x-cmd-action-ai/spec@main
        with:
          mode: ${{ github.event.inputs.mode }}
          issue-number: ${{ github.event.inputs.issue_number }}
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
